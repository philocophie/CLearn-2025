<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 2 - HTML & CSS</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <nav class="navbar">Cheva Week 01 - HTML & CSS</nav>
    <main class="container">
        <section id="form-section" class="card">
            <h2>Form Pendataan</h2>
            <form id="form-pendataan">
                <div class="form-group">
                    <label for="name">Nama</label>
                    <input type="text" id="name" name="name">
                </div>
                <div class="form-group">
                    <label for="nim">NIM</label>
                    <input type="text" id="nim" name="nim">
                </div>
                <div class="form-group">
                    <label for="akt">Angkatan</label>
                    <input type="number" id="akt" name="akt">
                </div>
                <div class="button-group">
                    <button type="button" class="btn cancel-btn">Cancel</button>
                    <button type="submit" class="btn submit-btn">Submit</button>
                </div>
            </form>
        </section>

        <section class="table-section card">
            <h2>Table Data</h2>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Nama</th>
                        <th>NIM</th>
                        <th>Angkatan</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Budi</td>
                        <td>1302990000</td>
                        <td>1999</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Cahyo</td>
                        <td>1302212000</td>
                        <td>2021</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>Dudi</td>
                        <td>1302301040</td>
                        <td>2020</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
